      coefficient ring. That field-only comparison (manuscript section 6) is not part of this
      formalisation.
    author_endorsement: not-contacted

related_formalizations: []

status:
  scope: >-
    Formalised, for the literal group algebra MonoidAlgebra (ZMod 2) (Multiplicative (ZMod 4)):
    the five-stage diagram F over the whole real line; the homology interleaving distance over
    all integer degrees; the derived interleaving distance in every localisation of real
    diagrams at objectwise quasi-isomorphisms; the strict homotopy-interleaving distance after
    arbitrary zigzags of both diagrams; and the full chain of (in)equalities.
    Not formalised or not claimed:
    - The exact value of d_HI(F,0); only the bounds 5/4 <= d_HI <= 5/2 are proved.
    - The separate field-only comparison in manuscript section 6.
    - Any statement about other diagrams, coefficient rings or model structures.
    The two theorems C4Separation.stageD_comp_stageD and C4Separation.xComp_comm are
    well-formedness facts: d squares to zero, and the stage maps are chain maps. They are listed
    in comparator.json so that Comparator checks their statements rather than requiring
    identical proof terms across modules.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
