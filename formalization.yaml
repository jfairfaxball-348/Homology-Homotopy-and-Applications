# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A quantitative homotopy-interleaving gap over the cyclic-four group algebra"
  description: >-
    Over the group algebra F2[C4] of the cyclic group of order four in characteristic two, we
    give an explicit five-stage real-indexed persistence diagram F of unbounded chain complexes.
    Its stages are shifts of the periodic free resolution of the trivial module, on half-open
    intervals [i, i+1), with zero diagram before time 0 and from time 5 on. We compare three
    distances from F to the zero diagram: the homology interleaving distance (supremum over all
    degrees of the interleaving distances of the F2-homology persistence modules); the
    interleaving distance in an arbitrary localisation of the category of whole real diagrams at
    the objectwise quasi-isomorphisms (the derived category of real diagrams); and the strict
    homotopy-interleaving distance, which allows arbitrary finite zigzags of objectwise
    quasi-isomorphisms of both entire diagrams, including nonzero acyclic replacements of zero.
    The Lean development proves d_CohI(F,0) = 1/2 < d_IHC(F,0) = 1 < 5/4 <= d_HI(F,0) <= 5/2. So
    the three distances are quantitatively separated by a single explicit example. The lower bound
    for the strict metric comes from a fourfold defining-system obstruction for the resolution. The
    derived upper bound comes from a natural nullhomotopy of the two-unit shift. The upper bound
    5/2 for the strict metric is witnessed directly, because every five-unit shift of F vanishes.
  authors:
    - "John Fairfax-Ball"
  license: "Apache-2.0"
  responsible_maintainers:
    - "John Fairfax-Ball"

