      models: ["Claude (Anthropic)", "ChatGPT (OpenAI)"]
      framework: "Claude Code; ChatGPT"
      tool_setup: >-
        AI agents carried out the research sessions, the manuscript drafting and the Lean
        development, under the owner's direction and session prompts. Checking used the pinned
        Lean v4.35.0-rc2 compiler, Mathlib, GitHub Actions and the toolchain's lake comparator.
        Repository records name Claude Code as the author of the final Lean proof sessions.
        They reference a ChatGPT end-of-session handoff for earlier sessions. A complete
        per-session record of which AI system and model was used is not kept in the repository.
      cost:
        wall_time: "About 176 numbered working sessions, October-November 2026"
        spend_usd: "not tracked"
        hardware: "cloud agent sessions and GitHub-hosted CI runners"
      prompting_notes: >-
        Owner-written session prompts and handoffs; see authoritative/NEXT_SESSION_PROMPT.md and
        the sessions/ directory for the recorded history.
  spend_usd: "not tracked"
  notes: >-
    The mathematics and the Lean proof were produced by AI agents in numbered sessions directed
    by the owner, who set targets and scope. Every Lean claim was checked by the Lean kernel,
    in local pinned builds and in GitHub Actions on exact pull-request heads and on merged main.
    The Palomar statement was checked against the solution with lake comparator.

fidelity:
  divergences: >-
    The manuscript uses right modules over B = F2[C4]. Lean uses left modules (ModuleCat), which
    is equivalent because the ring is commutative. The manuscript presents B as F2[t]/(t^4) with
    t = 1 + g. The Challenge uses the literal group algebra, and the certified proof transfers
    along the ring isomorphism C4.groupAlgebraEquiv. In the Challenge, each stage P[s] is defined
    directly: F2[C4] in degrees n >= s and zero below, with the same differentials and stage
    maps as the manuscript. Distances are valued in [0, infinity], and the infimum of an empty
    parameter set is infinity. No other divergence is known.

review:
  status: "agent-reviewed"
  reviewers:
    - "none"
  notes: >-
    The statement, definitions and quantifiers were audited by AI agents against the manuscript
    and recorded in formal/C4_LEAN_CROSSWALK.md. Lean kernel checking, independent kernel replay
    through lake comparator and CI are the machine evidence. No independent human expert review
    of the mathematics is recorded.

