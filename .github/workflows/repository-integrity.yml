name: Repository integrity
on:
  push:
  pull_request:
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static governance/catalogue validation
        run: python3 scripts/validate_repository.py

